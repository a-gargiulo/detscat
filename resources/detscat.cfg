# ******************************************************************************
# Title:            Input File 
#                   DetScat - A Particle Scattering Image Generator
#
# Author:           Aldo Gargiulo
#
# Last Modified:    07/02/2025
#
# ==============================================================================
# [README]
# ==============================================================================
#
# Coordinate System and Vectors
# -----------------------------
# - All positions, directions, and axes are defined in the LAB FRAME, a
#   Cartesian coordinate system aligned with the UVA detonation facility:
#       > x-axis: Streamwise direction
#       > y-axis: Parallel to sidewall (with optical access windows), pointing
#                 upward (against gravity)
#       > z-axis: Completes a right-handed system
#
# - Directional vectors (e.g., light propagation, camera orientation) are
#   normalized automatically; users do not need to provide unit vectors.
#
#
# Polarization Handling (DDSCAT Basis)
# ------------------------------------
# - The Incident light polarization is expressed relative to the complex DDSCAT
#   basis vectors (e01, e02):
#       > e01 : Defined in ddscat.par
#       > e02 : Automatically generated as e02 = X_DDSCAT × e01*
#
# - Users do not need to redefine e01 or e02. These are determined entirely
#   by the DDSCAT simulation data.
#
#
# Specifying Incident Polarization
# --------------------------------
# - Users specify the incident polarization as a linear combination of e01
#   and e02:
#       > P = c1 * e01 + c2 * e02
#
# - The coefficients (c1, c2) are complex scalars provided by the user.
#
# - Each coefficient is entered in the format:
#       > cj = [Re, Im];   j = 1,2
#
#   Example:
#       c1 = [1.0, 0.0]   # 1 + 0i
#       c2 = [0.0, 1.0]   # 0 + i
#
#
# Important Notes
# ---------------
# - The scattering matrix (F-matrix) is valid only for the e01/e02 basis used
#   in the DDSCAT simulation that generated it.
# - If combining multiple DDSCAT simulations, all must use the same e01/e02
#   basis.
# - After loading DDSCAT data, the program prints e01 and e02 (in the DDSCAT
#   frame aligned with the incident light) to remind the user of the actual
#   basis in use.
# - The program checks internally that all data sets share the same basis and
#   will issue an error otherwise.
# ******************************************************************************

# ==============================================================================
# [INCIDENT LIGHT SOURCE - LASER]
# ==============================================================================

# Wavelength 
wavelength_nm                   = 532.0

# Intensity
pulse_energy_mj                 = 25 
pulse_width_ns                  = 29.0e-03
beam_diameter_mm                = 10.0

# Polarization
e01_coefficient                 = [1.0, 0.0] 
e02_coefficient                 = [0.0, 0.0] 

# Position
light_source_direction          = [1.0, 0.0, -1.0]

# ==============================================================================
# [PARTICLES]
# ==============================================================================

particles_definition_file       = ../resources/particles.dat


# ==============================================================================
# [CAMERA]
# ==============================================================================

camera_center_position_m        = [-0.707, 0.0, -0.707]
camera_direction                = [1.0, 0.0, 1.0]
focal_length_mm                 = 300.0
f_number                        = 8
sensor_width_mm                 = 35.8
sensor_height_mm                = 22.4
sensor_resolution_x_px          = 1280
sensor_resolution_y_px          = 800

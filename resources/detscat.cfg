# ******************************************************************************
# Title:            Particle Scattering Image Generator - Input File
# Author:           Aldo Gargiulo
# Last Modified:    07/02/2025
#
# ==============================================================================
# [README]
# ==============================================================================
#
# Coordinate System and Vectors
# -----------------------------
# - All positions, directions, and axes are specified in the LAB FRAME, a
#   Cartesian coordinate system aligned with the UVA detonation facility
#   geometry:
#       * x-axis: Streamwise direction
#       * y-axis: Parallel to sidewall (with optical access windows), pointing
#                 up (against gravity)
#       * z-axis: Completes a right-handed coordinate system
#
# - Directional vectors (e.g., light propagation, camera orientation) are
#   normalized internally; users do not need to provide unit vectors.
#
# Polarization Handling
# ---------------------
# - Polarization vectors are handled internally for convenience. The user
#   specifies only high-level options:
#
#   polarization_type: Type of polarization. Options:
#       * LINEAR
#       * CIRCULAR_LEFT
#       * CIRCULAR_RIGHT
#       * ELLIPTICAL
#
#   polarization_axis: Reference axis in the LAB FRAME (X, Y, Z, or auto).
#       * For all polarization types, this axis is projected onto the plane
#         perpendicular to the light propagation direction to generate a valid
#         polarization vector.
#       * 'auto' provides a safe default perpendicular vector if the user does
#         not wish to pick a specific lab axis.
#
#   Elliptical polarization parameters (only used if polarization_type =
#   ELLIPTICAL):
#       * alpha: Orientation angle of the major axis in the plane perpendicular
#                to the light propagation direction [degrees].
#                    - alpha = 0 deg : major axis aligned with the projected
#                                      polarization_axis
#                    - alpha = 90 deg: major axis perpendicular to the projected
#                                      polarization_axis
#       * alpha: Orientation angle of the major axis in the plane perpendicular
#                to the light propagation direction [degrees]
#       * beta:  Ellipticity angle [degrees] (0 = linear, +/- 45 = circular)
#
# ******************************************************************************

# ==============================================================================
# [INCIDENT LIGHT SOURCE - LASER]
# ==============================================================================

# Wavelength 
wavelength_nm                   = 532.0

# Intensity
pulse_energy_mj                 = 1.3e-03
pulse_width_ns                  = 29.0e-03
beam_diameter_mm                = 10.0

# Polarization
polarization_type               = linear
polarization_axis               = auto
elliptical_alpha_deg            = 0.0
elliptical_beta_deg             = 0.0

# Position
light_source_position_m         = [0.0, 0.0, 0.0]
light_source_direction          = [1.0, 0.0, 0.0]



# ==============================================================================
# [PARTICLES]
# ==============================================================================

particles_definition_file       = ../resources/particles.dat


# ==============================================================================
# [CAMERA]
# ==============================================================================

camera_center_position_m        = [1.5, 0.0, 0.0]
camera_direction                = [-1.0, 0.0, 0.0]
focal_length_mm                 = 300.0
sensor_width_mm                 = 35.8
sensor_height_mm                = 22.4
sensor_resolution_x_px          = 1280              # Also output image width
sensor_resolution_y_px          = 800               # Also output image height
